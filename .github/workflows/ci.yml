name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Detect docs-only changes to skip CI entirely
  # ──────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.filter.outputs.docs-only == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `every` is essential: the default `some` marks a PR docs-only when
          # ANY file matches, so one .md alongside 100 .ts files skipped every gate.
          predicate-quantifier: every
          filters: |
            docs-only:
              - '**/*.md'
              - '**/*.mdx'
              - 'LICENSE'
              - 'LICENSE-content'
              - '.github/labeler.yml'
              - '.github/release-notes.yml'
              - '.github/workflows/label.yml'
              - '.github/pull_request_template.md'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/FUNDING.yml'

  # ──────────────────────────────────────────────
  # Lint, format, and type-check
  # ──────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.should-skip != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint-and-typecheck]
    if: needs.changes.outputs.should-skip != 'true'
    env:
      # Every env var is optional in env.ts, so the build passes with none set.
      # A placeholder key is still supplied so the build exercises the same
      # configured-key path production takes rather than the unset branch.
      GOOGLE_API_KEY: ci-placeholder-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # Next 16 no longer prints First Load JS, so a regression in client bundle
      # size is otherwise invisible in review. Measured, not analyzed: no extra
      # dependency, and the number is the one users actually download.
      #
      # Baseline at the time of writing: ~1330 KB. The budget carries ~12%
      # headroom, so it catches a newly-eager dependency rather than normal
      # growth. Raise it deliberately, with a note saying what grew.
      - name: Client bundle budget
        run: |
          BUDGET_KB=1500
          SIZE_KB=$(du -sk .next/static/chunks | cut -f1)
          echo "Client chunks: ${SIZE_KB} KB (budget ${BUDGET_KB} KB)"
          if [ "$SIZE_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::Client chunks grew to ${SIZE_KB} KB, over the ${BUDGET_KB} KB budget. Check for a newly-eager dependency, or raise the budget deliberately."
            exit 1
          fi
