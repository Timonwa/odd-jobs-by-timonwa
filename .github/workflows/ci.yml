name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The `name:` of the lint, test, and build jobs are the check contexts the
  # main ruleset requires — rename one and PRs wait forever on a check that
  # will never report.

  # ──────────────────────────────────────────────
  # Detect docs-only changes to skip CI entirely
  # ──────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.filter.outputs.docs-only == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `every` is essential: the default `some` marks a PR docs-only when
          # ANY file matches, so one .md alongside 100 .ts files skipped every gate.
          predicate-quantifier: every
          filters: |
            docs-only:
              - '**/*.md'
              - '**/*.mdx'
              - 'LICENSE'
              - 'LICENSE-content'
              - '.github/labeler.yml'
              - '.github/workflows/label.yml'
              - '.github/pull_request_template.md'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/FUNDING.yml'

  # ──────────────────────────────────────────────
  # Lint, format, and type-check
  # ──────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.should-skip != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

  # ──────────────────────────────────────────────
  # Unit tests (Vitest)
  # ──────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.should-skip != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Test (Vitest)
        run: pnpm test

  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint-and-typecheck, test]
    if: needs.changes.outputs.should-skip != 'true'
    env:
      # Every env var is optional in env.ts, so the build passes with none set.
      # A placeholder key is still supplied so the build exercises the same
      # configured-key path production takes rather than the unset branch.
      GOOGLE_API_KEY: ci-placeholder-key

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build
