name: Release notes

# Drafts release notes from merged PRs, categorized by label.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6.4.0
        with:
          config-name: release-notes.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
