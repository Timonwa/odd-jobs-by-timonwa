name: Auto-assign

# Assigns the maintainer when a PR opens, so nothing sits unowned.
on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --add-assignee Timonwa
