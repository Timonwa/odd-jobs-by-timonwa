# Release-note categories and their labels, read by release-notes.yml
# (release-drafter). PR labels come from label.yml plus the autolabeler below.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "New"
    labels: ["feature"]
  - title: "Fixed"
    labels: ["fix"]
  - title: "Changed"
    labels: ["refactor", "performance"]
  - title: "Docs"
    labels: ["docs"]
  - title: "Dependencies"
    labels: ["dependencies"]
autolabeler:
  - label: "feature"
    title: ["/^feat(\\(.+\\))?!?:/"]
  - label: "fix"
    title: ["/^fix(\\(.+\\))?!?:/"]
  - label: "refactor"
    title: ["/^refactor(\\(.+\\))?!?:/"]
  - label: "performance"
    title: ["/^perf(\\(.+\\))?!?:/"]
  - label: "docs"
    title: ["/^docs(\\(.+\\))?!?:/"]
change-template: "- $TITLE (#$NUMBER)"
template: |
  ## What changed

  $CHANGES
version-resolver:
  major:
    labels: ["breaking"]
  minor:
    labels: ["feature"]
  default: patch
